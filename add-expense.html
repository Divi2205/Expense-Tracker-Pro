<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Expense | Expense Tracker Pro</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* === Page-specific Enhancements === */
    body {
      background: linear-gradient(135deg, #74b9ff, #a29bfe, #81ecec);
      background-attachment: fixed;
      font-family: "Poppins", sans-serif;
      margin: 0;
      color: #fff;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    nav h2 {
      font-weight: 600;
      color: #fff;
    }

    .nav-links a {
      color: #fff;
      margin: 0 10px;
      text-decoration: none;
      transition: 0.3s;
      padding: 6px 12px;
      border-radius: 8px;
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    main.glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      margin: 40px auto;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h2, h3 {
      text-align: center;
      margin-bottom: 20px;
      color: #f1f2f6;
    }

    .form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 25px;
    }

    input {
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 180px;
      font-size: 15px;
      transition: 0.3s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.8);
    }

    input:focus {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.03);
    }

    button {
      background: linear-gradient(135deg, #6c5ce7, #0984e3);
      border: none;
      border-radius: 10px;
      color: white;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      background: linear-gradient(135deg, #00cec9, #6c5ce7);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    th {
      background: rgba(255, 255, 255, 0.15);
      color: #dfe6e9;
      text-transform: uppercase;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.2);
      transition: 0.3s;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: #fff;
      margin-top: 30px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <nav>
    <h2>💰 Expense Tracker Pro</h2>
    <div class="nav-links">
      <a href="index.html">🏠 Dashboard</a>
      <a href="add-expense.html" class="active">➕ Add Expense</a>
      <a href="analytics.html">📊 Analytics</a>
      <a href="chatbot.html">🤖 Chatbot</a>
      <a href="profile.html">👤 Profile</a>
      <button onclick="toggleTheme()">🌙</button>
    </div>
  </nav>

  <main class="glass">
    <h2>✨ Add Your Expenses</h2>
    <div class="form">
      <input id="category" type="text" placeholder="Category (e.g. Food)">
      <input id="description" type="text" placeholder="Description">
      <input id="amount" type="number" placeholder="Amount ₹">
      <button id="addBtn">Add Expense</button>
    </div>

    <h3>💸 Set Monthly Budget</h3>
    <div style="text-align:center; margin-bottom:20px;">
      <input id="budget" type="number" placeholder="Set Budget ₹">
      <button id="budgetBtn">Save Budget</button>
    </div>

    <table id="expenseTable">
      <thead>
        <tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Action</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <footer>💡 Track every rupee, reach your goals!</footer>
  <script src="script.js"></script>
</body>
</html>
