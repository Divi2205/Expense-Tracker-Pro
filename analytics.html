<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 Analytics | Expense Tracker Pro</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ===== Background & Typography ===== */
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #6c5ce7, #74b9ff, #00cec9);
      background-attachment: fixed;
      color: #fff;
    }

    /* ===== Navbar ===== */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    nav h2 {
      font-weight: 600;
      color: #fff;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      margin: 0 10px;
      padding: 6px 12px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    /* ===== Main Content ===== */
    main.glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      width: 90%;
      max-width: 1100px;
      margin: 50px auto;
      padding: 40px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h2 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #f1f2f6;
    }

    canvas {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      margin-top: 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
    }

    canvas:hover {
      transform: scale(1.02);
      background: rgba(255, 255, 255, 0.25);
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      padding: 20px;
      color: #fff;
      font-size: 14px;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      main.glass {
        padding: 20px;
      }
      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body onload="loadAnalytics()">
  <nav>
    <h2>💰 Expense Tracker Pro</h2>
    <div class="nav-links">
      <a href="index.html">🏠 Dashboard</a>
      <a href="add-expense.html">➕ Add Expense</a>
      <a href="analytics.html" class="active">📊 Analytics</a>
      <a href="chatbot.html">🤖 Chatbot</a>
      <a href="profile.html">👤 Profile</a>
      <button onclick="toggleTheme()">🌙</button>
    </div>
  </nav>

  <main class="glass">
    <h2>📈 Expense Analytics</h2>
    <p>Visualize your spending trends and categories at a glance.</p>

    <div class="charts">
      <canvas id="pieChart" height="200"></canvas>
      <canvas id="lineChart" height="200"></canvas>
    </div>
  </main>

  <footer>💡 Analyze your habits, grow smarter.</footer>

  <script src="script.js"></script>
  <script>
    async function loadAnalytics() {
      try {
        const res = await fetch("http://localhost:3000/expenses");
        const data = await res.json();

        if (!data.length) {
          alert("No expense data available!");
          return;
        }

        // Group by category
        const categories = {};
        data.forEach(exp => {
          categories[exp.category] = (categories[exp.category] || 0) + parseFloat(exp.amount);
        });

        // Sort by date for line chart
        const dates = data.map(exp => exp.date);
        const amounts = data.map(exp => parseFloat(exp.amount));

        // === Pie Chart (Category Breakdown) ===
        new Chart(document.getElementById("pieChart"), {
          type: "pie",
          data: {
            labels: Object.keys(categories),
            datasets: [{
              data: Object.values(categories),
              backgroundColor: ["#6c5ce7", "#00cec9", "#fdcb6e", "#e17055", "#0984e3", "#fab1a0"],
              borderWidth: 1,
              borderColor: "#fff"
            }]
          },
          options: {
            plugins: {
              legend: { position: "bottom", labels: { color: "#fff" } },
              title: { display: true, text: "Spending by Category", color: "#fff", font: { size: 18 } }
            }
          }
        });

        // === Line Chart (Spending Over Time) ===
        new Chart(document.getElementById("lineChart"), {
          type: "line",
          data: {
            labels: dates,
            datasets: [{
              label: "Expense Trend",
              data: amounts,
              borderColor: "#00cec9",
              backgroundColor: "rgba(0, 206, 201, 0.2)",
              fill: true,
              tension: 0.3,
              pointRadius: 5,
              pointHoverRadius: 8
            }]
          },
          options: {
            scales: {
              x: { ticks: { color: "#fff" } },
              y: { ticks: { color: "#fff" } }
            },
            plugins: {
              legend: { labels: { color: "#fff" } },
              title: { display: true, text: "Expenses Over Time", color: "#fff", font: { size: 18 } }
            }
          }
        });
      } catch (err) {
        console.error("Error loading analytics:", err);
      }
    }
  </script>
</body>
</html>
